# Try Conway locally: `docker compose up --build`, then open http://localhost:8741
# (admin password is generated and printed to `docker compose logs conway` unless
# you set CONWAY_ADMIN_PASSWORD below). Seeds a small synthetic demo org on first
# boot (CONWAY_SEED_BASELINE=true) — set it to "false" for an empty first-run and
# import your own org from Jira instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conway
      POSTGRES_PASSWORD: conway
      POSTGRES_DB: conway
    volumes:
      - conway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conway"]
      interval: 5s
      timeout: 5s
      retries: 10

  conway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8741:8741"
    environment:
      DATABASE_URL: postgres://conway:conway@postgres:5432/conway?sslmode=disable
      CONWAY_ADMIN_PASSWORD: ${CONWAY_ADMIN_PASSWORD:-}
      CONWAY_SEED_BASELINE: ${CONWAY_SEED_BASELINE:-true}
      # Optional — see README.md "Configuration reference":
      # CONWAY_JIRA_BASE_URL, CONWAY_JIRA_SITE_HINT, CONWAY_PUBLIC_URL,
      # CONWAY_JIRA_CLIENT_ID, CONWAY_JIRA_CLIENT_SECRET
    volumes:
      - conway-data:/data

volumes:
  conway-postgres:
  conway-data:
