name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install pinned tools
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.5
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # The action's major version must match the golangci-lint major it installs:
      # v6 is golangci-lint v1 only, v7+ are v2 only. The pack shipped v6 with a
      # v2.x pin, so this step failed before the linter ran at all. v8 supports
      # v2 and requires >= v2.1.0, which the pin below satisfies; v9 additionally
      # moves the action to the Node 24 runtime.
      # Verified 2026-08-17 against github.com/golangci/golangci-lint-action/releases
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: actionlint
        run: actionlint

      # -severity medium, not the default: the 60 LOW findings here are all G104
      # (unhandled errors), the same pre-existing debt errcheck reports, and
      # standalone gosec has no new-code baseline to hold them behind. Medium and
      # high still fail the build immediately rather than only on changed code,
      # and errcheck covers the LOW class under .golangci.yml's merge-base
      # baseline. Note gosec reads #nosec annotations, not //nolint.
      - name: gosec
        run: gosec -severity medium ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: go test -race
        run: go test -race ./...

      # Scoped to the flow engine, the highest-stakes package: every Plan number
      # derives from it. Whole-repo mutation runs are slow enough to stop being run.
      - name: Mutation testing (planning engine)
        run: gremlins unleash ./server/planning/... --dry-run
        continue-on-error: true

      - name: citation-lint
        run: ./scripts/citation-lint.sh

      - name: wiki-lint
        run: ./scripts/hooks/wiki-lint.sh

      # ginkgo-only-check is deliberately omitted: Conway's 19 test files use
      # stdlib testing, so this gate would fail every run. Note it also fails
      # OPEN where ripgrep is absent, reporting success while checking nothing.
      # See specs/002-factory-adoption.md Decision 4 and Q2.

      # internal-paths-ignored is deliberately NOT run here. Its pattern list is
      # in .git/info/exclude, which is never pushed, so a CI checkout has no list
      # and no internal files to protect — it could only fail for the wrong
      # reason. It is a local gate, wired into `make test` and `make preflight`.


      - name: shared-script-enforcement
        run: ./scripts/hooks/shared-script-enforcement.sh

      - name: hook-existence-check
        run: ./scripts/hooks/hook-existence-check.sh

      # Ordered BEFORE diff-aware-check on purpose. diff-aware-check writes
      # memory/.parity-stale whenever .opencode/plugin/factory-hooks.ts is in the
      # diff range, and this step blocks on that flag — so running it afterwards
      # tests a flag its own sibling just created, not the committed state.
      # Recorded upstream as specs/002-factory-adoption.md FR-021.
      - name: pending-lessons-push-block
        run: ./scripts/hooks/pending-lessons-push-block.sh

      - name: diff-aware-check
        run: ./scripts/hooks/diff-aware-check.sh origin/${{ github.base_ref || 'main' }} HEAD

      - name: decision-log-gate
        if: github.event_name == 'pull_request'
        run: ./scripts/hooks/decision-log-gate.sh origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }}


      - name: commit-message-lint
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "$BASE" 2>/dev/null || true
          for sha in $(git rev-list "$BASE..$HEAD_SHA"); do
            echo "--- $sha ---"
            ./scripts/hooks/commit-message-lint.sh "$sha"
          done

      - name: Claude config drift check
        run: |
          chmod +x scripts/sync-claude.sh
          make sync-claude
          if ! git diff --quiet .claude/ .mcp.json; then
            echo "DRIFT: Claude config does not match opencode.json sync output."
            echo "Run 'make sync-claude' locally and commit the changes."
            git diff --stat .claude/ .mcp.json
            exit 1
          fi

      - name: Codex config drift check
        run: |
          chmod +x scripts/sync-codex.sh
          make sync-codex
          if ! git diff --quiet .codex/; then
            echo "DRIFT: Codex config does not match canonical opencode role sources."
            echo "Run 'make sync-codex' locally and commit the changes."
            git diff --stat .codex/
            exit 1
          fi

      - name: Harness structural parity
        run: |
          ./scripts/harness-structural-eval.sh --harness=opencode
          ./scripts/harness-structural-eval.sh --harness=claude
          ./scripts/harness-structural-eval.sh --harness=codex

  golden-task-eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Golden-task evals
        run: ./scripts/golden-task-eval.sh --harness=opencode
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
