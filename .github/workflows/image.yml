name: Image

# Builds the container image on every pull request and publishes it to GHCR on
# main and on version tags. Deliberately a separate workflow from the factory's
# ci.yml / go-pack.yml: those are pack files the factory owns and refreshes, this
# one is Conway's.
#
# Until this existed, nothing verified the Dockerfile at all — it could break and
# only a human running `deploy/build-push.sh` would find out.
#
# The build and publish jobs are split so the pull-request path never receives a
# token that can write packages. Only one runs per event.
#
# Both jobs use the same BuildKit cache scope, but that is not a claim that a PR
# build warms main: GitHub Actions caches are keyed by ref, and a cache written on
# a PR ref is not readable from a later push to main — only the reverse (a PR can
# read its base branch's cache). What the shared scope does buy is that pushes to
# main reuse each other's layers, and PR builds reuse what main last published.
#
# Action versions checked against each repository's latest release, 2026-08-17.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege at the top: no job gets more than this unless it asks.
permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests: prove the Dockerfile builds. No registry, no credentials, and
  # no packages: write — a same-repository PR cannot publish an image from here.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Build (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=conway-image
          cache-to: type=gha,scope=conway-image,mode=max

      - run: echo "Built the image without pushing (pull request)."

  # main and v* tags: build and publish. GITHUB_TOKEN with packages: write is
  # enough for GHCR in the same org — no PAT, nothing to rotate.
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package name is the last path segment: ghcr.io/<owner>/conway.
      #
      # Tagging follows the convention docker/metadata-action documents: `edge`
      # is the last commit of the default branch (the same meaning official
      # images like Alpine give it), and `latest` is reserved for releases. The
      # action's default `latest=auto` flavour attaches `latest` to semver tag
      # events by itself, so it is deliberately not set here — an earlier version
      # of this workflow pinned `latest` to main, which would have made `latest`
      # mean "tip of development" to anyone pulling it.
      #
      # So: a merge to main publishes `edge` and `sha-<full-commit>`; a v* tag
      # publishes the semver trio plus `latest`.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/conway
          tags: |
            type=edge,branch=main
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # mode=max, not the default min: this is a multi-stage build, and min only
      # exports layers of the final image — the golang stage that does the actual
      # compiling is intermediate and would never be cached. The scope is set
      # explicitly so a second image added later cannot overwrite this cache.
      # Writes from this job land on the default branch's cache, which is the one
      # PR builds are allowed to read.
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=conway-image
          cache-to: type=gha,scope=conway-image,mode=max

      - name: Report
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.tags }}"
