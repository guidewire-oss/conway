# Software Factory configuration. Flat key: value only — one value per line.
# Lists are space-separated. Parsed by scripts/lib/config.sh. See Decision 2
# in the template's docs/DECISION_LOG.md.
project_name: conway
decision_log: docs/DECISION_LOG.md
docs_root: specs
# Empty disables citation-lint. Conway's specs are named NNN-name.md, so a
# SPEC_*.md citation could never resolve against any file — an armed gate that
# can only ever pass vacuously. Arm this when specs are actually cited by
# file:line from code, per specs/002-factory-adoption.md FR-010.
citation_prefix: ""
protected_paths: ""
test_file_patterns: "_test\.go([^[:alnum:]_]|$)"
language_packs: "go"
# The Go pack's ginkgo-only-check.sh is deliberately NOT in this chain: Conway's
# 19 test files use stdlib testing, and arming a gate the whole suite violates
# would leave CI permanently red. See specs/002-factory-adoption.md Decision 4
# and its open question Q2 — converting the suite is a separate decision.
# node --test covers the pure JS engine (tests/sim.test.mjs), which no Go step sees.
check_command: "go test -race ./... && golangci-lint run ./... && node --test tests/sim.test.mjs"
# Your own hooks go here, not in hook-existence-check.sh (a framework file
# that upgrade overwrites). Space-separated paths.
local_hooks: "scripts/hooks/internal-paths-ignored.sh"
wiki_root: wiki
wiki_staleness: false

# ── Identity ─────────────────────────────────────────────────────────
project_display_name: "Conway"
github_owner: "@guidewire-oss"
opencode_username: "conway-founder"

# ── Models ───────────────────────────────────────────────────────────
# Which provider seeded the tiers below. Blank tiers mean "inherit": sync writes
# nothing and each harness keeps its own model. See docs/MODELS.md.
cost_profile: "standard"
model_provider: "inherit"
opencode_frontier_model: ""
opencode_default_model: ""
opencode_economy_model: ""
claude_frontier_model: ""
claude_default_model: ""
claude_economy_model: ""
codex_frontier_model: ""
codex_default_model: ""
codex_economy_model: ""

# ── Advisory adversarial PR review ───────────────────────────────────
# Opt-in; costs tokens per PR and needs the repository secret named below.
# Toggle with: ./factory review-lane enable|disable
review_lane: "off"
review_model: ""
review_api_key_secret: "OPENROUTER_API_KEY"

# ── Toolchain versions ───────────────────────────────────────────────
go_version: "1.26.6"
java_version: "25"
node_version: "24"
go_min_version: "1.26"
